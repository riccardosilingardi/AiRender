# Netlify legge questo file se la "Base directory" del sito e' server/.
[build]
  # La web app dello Studio (public/studio/) si costruisce dallo Studio sul
  # PC a ogni deploy: vedi scripts/scrivi_web.py.
  command = "python3 ../scripts/scrivi_web.py"
  publish = "public"
  # Netlify salta il deploy se non cambia niente nella base directory
  # (server/): la web app nasce anche da core/, web/ e scripts/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../core ../web ../scripts"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["listino.json"]
